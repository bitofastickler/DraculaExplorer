# Weights were frozen before scoring chapters 14-27.
# male_givens / female_givens are a small honorific-agreement prior, not a
# name census. They only block Mr/Mrs clashes such as Mrs Harker vs Jonathan.
auto_merge_threshold: 0.85
review_threshold: 0.60
jaro_block: 0.92
rare_token_max_surfaces: 30
# Share of full-name mentions a surname needs before a bare given name
# ("John") joins it. Set after the held-out run, see README.
given_dominance: 0.6
weights:
  jaro: 0.40
  surname: 0.30
  given: 0.20
  honorific: 0.10
male_givens: [jonathan, arthur, john, abraham, quincey, quincy, peter]
female_givens: [mina, lucy, wilhelmina]
diminutives:
  wilhelmina: mina
  quincy: quincey
  jack: john
narrator_to_entity:
  Jonathan Harker: jonathan_harker
  Mina Murray: mina_harker
  Mina Harker: mina_harker
  Lucy Westenra: lucy_westenra
  Dr. John Seward: john_seward
  Abraham Van Helsing: abraham_van_helsing
  Arthur Holmwood: arthur_holmwood
  Quincey Morris: quincey_morris
# Writers as section headings name them -> the narrator labels above.
# Used by scripts/build_corpus.py.
writer_labels:
  Dr. Seward: Dr. John Seward
  Seward: Dr. John Seward
  Dr. Van Helsing: Abraham Van Helsing
  Van Helsing: Abraham Van Helsing
  Mrs. Harker: Mina Harker
  Quincey P. Morris: Quincey Morris
part_of:
  - [carfax, london]
# Surfaces the small NER model tags as names that are not entities in the
# story (document labels, exclamations, common nouns). Dropped before
# resolution. Case-insensitive; a trailing 's is ignored.
not_entities: [
  telegram, letter, memorandum, mem, vampire, wafer, lor, hitherto, ho, ring, god, un-dead, mein gott, herr, mein herr, king laugh, afraid, behold, breakfast, angel, angels,
  # Bare compass points ("the East"), saints' titles, forms of address,
  # objects, a plural couple, and the Gutenberg publisher line.
  east, west, south, north, ste, devil, cross, bay, consul, superintendent,
  lordship, sirs, winchesters, harkers, "i.", "i. 'bersicker", new york,
  sacred wafer, woe]
