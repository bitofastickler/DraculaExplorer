    canonical_name: Mina Harker
    entity_type: PER
    aliases: [mina harker, mina murray, mina, mrs harker, mrs murray, miss murray, miss mina murray, wilhelmina murray, miss wilhelmina murray, madam mina]
  - id: lucy_westenra
