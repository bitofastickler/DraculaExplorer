# Alias strings are the normalized forms produced by parse_name
# (lowercase, honorific kept when it is part of the surface).
# A proper mention matches an entity when one of its forms hits this list
# and the entity types agree. "dracula" is not an alias of the castle.
entities:
  - id: count_dracula
    canonical_name: Count Dracula
    entity_type: PER
    aliases: [count dracula, dracula, the count]
  - id: jonathan_harker
    canonical_name: Jonathan Harker
    entity_type: PER
    aliases: [jonathan harker, jonathan, mr harker, mr jonathan harker]
