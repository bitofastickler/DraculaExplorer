# Relationships the novel states, written from a reading of the book.
# None of these is trusted on its own: the build keeps a row only when a
# sentence in the text names both entities with one of the cue words
# close to each name (a word prefix, so "propos" matches "proposals").
# Rows the text does not confirm stay here as a record of what was tried.
# A first-person pronoun outside dialogue stands for the document's
# narrator, so "my husband" in Mina's journal can name her.
# Friendships among the men are left out: Van Helsing calls everyone
# "friend", so the cue word does not tell who is whose friend.
relations:
  - {rel: married_to, source: jonathan_harker, target: mina_harker, cues: [husband, wife, married, marriage, wedding]}
  - {rel: engaged_to, source: arthur_holmwood, target: lucy_westenra, cues: [engaged, engagement, marry, married, fianc, betrothed, lover, wedding]}
  - {rel: proposed_to, source: john_seward, target: lucy_westenra, cues: [propos, marry]}
  - {rel: proposed_to, source: quincey_morris, target: lucy_westenra, cues: [propos, marry]}
  - {rel: mother_of, source: mrs_westenra, target: lucy_westenra, cues: [mother]}
  - {rel: patient_of, source: rm_renfield, target: john_seward, cues: [patient]}
  - {rel: teacher_of, source: abraham_van_helsing, target: john_seward, cues: [master, teacher, pupil, student]}
  - {rel: employed_by, source: jonathan_harker, target: peter_hawkins, cues: [employer, clerk]}
  - {rel: partner_of, source: jonathan_harker, target: peter_hawkins, cues: [partner]}
  - {rel: client_of, source: count_dracula, target: peter_hawkins, cues: [client]}
  - {rel: friend_of, source: lucy_westenra, target: mina_harker, cues: [friend]}
  - {rel: prisoner_of, source: jonathan_harker, target: count_dracula, cues: [prisoner, captive, guest, host]}
  - {rel: preys_on, source: count_dracula, target: lucy_westenra, cues: [blood, bite, bitten, vampire, prey, victim]}
  - {rel: preys_on, source: count_dracula, target: mina_harker, cues: [blood, bite, bitten, vampire, prey, victim, baptism]}
  - {rel: owns, source: count_dracula, target: carfax, cues: [house, estate, purchase, bought, property]}
  - {rel: lives_at, source: count_dracula, target: castle_dracula, cues: [home, house, lives, return]}
  - {rel: lives_at, source: lucy_westenra, target: hillingham, cues: [home, house]}
  - {rel: travels_on, source: count_dracula, target: demeter, cues: [ship, board, aboard, cargo, boxes]}
  - {rel: travels_on, source: count_dracula, target: czarina_catherine, cues: [ship, board, aboard, cargo, box]}
